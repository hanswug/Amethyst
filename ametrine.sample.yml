# Hans's Ametrine config, snapshot of 2026-10-14. Copy to ~/.config/ametrine/ametrine.yml.
# Ametrine configuration: the only source of settings and key bindings.
# Location: ~/.config/ametrine/ametrine.yml (or ~/.ametrine.yml).
# Menu: Edit Config… opens this file; Reload Config relaunches to apply changes.
# A command is bound only if this file binds it. Settings left out get built-in defaults.
# Reference: docs/configuration-files.md in the Ametrine repo.

# layouts - Ordered list of layouts to use by layout key (default tall, wide, fullscreen, and column).
layouts:
  - fullscreen
  # - tall-right
  # wide
  - two-pane
  - 3column-left
  - middle-wide
  - tall
  # - middle-wide # The legacy name of "3column-middle"
  # - 3column-right
  # - 4column-left
  # - 4column-right
  # - column
  # - row
  # - floating
  # - widescreen-tall
  # - widescreen-tall-right
  - bsp

# First mod (default option + shift).
mod1:
  - option
  # - shift
  - control
  # - command

# Second mod (default option + shift + control).
mod2:
  - option
#  - shift
  - control
  - command

# Commands:
# special key values
# space
# enter
# up
# right
# down
# left
# delete

# special characters require quotes
# '.'
# ','

# Move to the next layout in the list.
cycle-layout:
  mod: mod1
  key: '.'

# Move to the previous layout in the list.
cycle-layout-backward:
  mod: mod2
  key: ','

# Shrink the main pane by a percentage of the screen dimension as defined by window-resize-step. Note that not all layouts respond to this command.
shrink-main:
  mod: mod1
  key: '-'

# Expand the main pane by a percentage of the screen dimension as defined by window-resize-step. Note that not all layouts respond to this command.
expand-main:
 mod: mod1
 key: '='

# Increase the number of windows in the main pane. Note that not all layouts respond to this command.
increase-main:
 mod: mod2
 key: '='

# Decrease the number of windows in the main pane. Note that not all layouts respond to this command.
decrease-main:
  mod: mod2
  key: '-'

# General purpose command for custom layouts. Functionality is layout-dependent.
# command1:
#   mod: <NONE>
#   key: <NONE>
# General purpose command for custom layouts. Functionality is layout-dependent.
# command2:
#   mod: <NONE>
#   key: <NONE>
# General purpose command for custom layouts. Functionality is layout-dependent.
# command3:
#   mod: <NONE>
#   key: <NONE>
# General purpose command for custom layouts. Functionality is layout-dependent.
# command4:
#   mod: <NONE>
#   key: <NONE>

# Previous/next retired for directional focus and swap (an Alt-Tab app covers previous/next).
# Focus the next window in the list going counter-clockwise.
focus-ccw:
  mod: <NONE>
  key: <NONE>

# Focus the next window in the list going clockwise.
focus-cw:
  mod: <NONE>
  key: <NONE>

# Focus the main window in the list.
focus-main:
  mod: mod1
  key: m

# Swap the position of the currently focused window with the next window in the list going counter-clockwise.
swap-ccw:
  mod: <NONE>
  key: <NONE>

# Swap the position of the currently focused window with the next window in the list going clockwise.
swap-cw:
  mod: <NONE>
  key: <NONE>

# Swap the position of the currently focused window with the main window in the list.
swap-main:
  mod: mod2
  key: m

# Focus the tiled window in that direction (only visible windows; Fullscreen: west/east cycle).
focus-west:
  mod: mod1
  key: h

focus-south:
  mod: mod1
  key: j

focus-north:
  mod: mod1
  key: k

focus-east:
  mod: mod1
  key: l

# Swap the focused window with the tiled window in that direction.
swap-west:
  mod: mod2
  key: h

swap-south:
  mod: mod2
  key: j

swap-north:
  mod: mod2
  key: k

swap-east:
  mod: mod2
  key: l

# Select wide layout
#select-wide-layout:
#  mod: mod1
#  key: s

# Select fullscreen layout
select-fullscreen-layout:
  mod: mod1
  key: '1'

# Select two-pane layout
select-two-pane-layout:
  mod: mod1
  key: '2'

# Select 3column-left layout
select-3column-left-layout:
  mod: mod1
  key: '3'

# Select 3column-middle layout
select-middle-wide-layout:
  mod: mod1
  key: '4'

# Select tall layout
select-tall-layout:
  mod: mod1
  key: '5'

# The following commands used to be bound by built-in defaults and were never chosen explicitly,
# so they are unbound (<NONE>). Ametrine binds only what this file binds; set mod/key to bind one.

# Select wide layout.
select-wide-layout:
  mod: <NONE>
  key: <NONE>

# Select column layout.
select-column-layout:
  mod: <NONE>
  key: <NONE>

# Select bsp layout.
select-bsp-layout:
  mod: <NONE>
  key: <NONE>

# Toggle the floating state of the currently focused window; i.e., if it was floating make it tiled and if it was tiled make it floating.
toggle-float:
  mod: mod1
  key: t

# Show in a HUD whether the focused window is tiled, floating or not managed, and why.
explain-window:
  mod: <NONE>
  key: <NONE>

# Turn the focus border on or off until Reload Config.
toggle-focus-border:
  mod: <NONE>
  key: <NONE>

# Switch the focus border style (glow, solid, gradient) until Reload Config.
cycle-focus-border-style:
  mod: <NONE>
  key: <NONE>

# Switch main-arrival-position between first and last until Reload Config.
toggle-main-arrival-position:
  mod: <NONE>
  key: <NONE>

# Display the layout HUD with the current layout on each screen.
display-current-layout:
  mod: mod1
  key: i

# Turn on or off tiling entirely.
toggle-tiling:
 mod: <NONE>
 key: <NONE>

# Turn on tiling.
enable-tiling:
  mod: <NONE>
  key: <NONE>

# Turn off tiling.
disable-tiling:
  mod: <NONE>
  key: <NONE>

# Rerun the current layout's algorithm.
reevaluate-windows:
  mod: mod2
  key: r

# Turn on or off focus-follows-mouse.
toggle-focus-follows-mouse:
 mod: <NONE>
 key: <NONE>

# Automatically quit and reopen Ametrine.
relaunch-ametrine:
 mod: <NONE>
 key: <NONE>

# disable screen padding on builtin display
disable-padding-on-builtin-display: true

# Boolean flag for whether or not to add margins between windows (default false).
window-margins: true

# Boolean flag for whether or not to set window margins if there is only one window on the screen, assuming window margins are enabled (default false).
smart-window-margins: false

# # Add 10px margin between windows
# window-margins: true
# window-margin-size: 5
# The size of the margins between windows (in px, default 0).
window-margin-size: 8

# The max number of windows that may be visible on a screen at one time before
# additional windows are minimized or float (see window-overflow). A value of 0 disables the feature.
window-max-count: 0

# What happens to windows over window-max-count: minimize (the oldest window outside the main pane
# is minimised) or float (the newest windows float, centred, and the tiles stay as they are) (default minimize).
window-overflow: float

# The size of a window floated over the limit: reasonable (the share of the screen below) or
# fixed (window-overflow-width x window-overflow-height) (default reasonable).
window-overflow-size: reasonable

# The reasonable size, in percent of the screen's usable width and height (1-100, defaults 60 and 70).
window-overflow-reasonable-width: 60
window-overflow-reasonable-height: 70

# The fixed size in points, never bigger than the screen (0 = not set; fixed then uses reasonable).
window-overflow-width: 0
window-overflow-height: 0

# Switch window-overflow between minimize and float until Reload Config.
toggle-window-overflow:
  mod: <NONE>
  key: <NONE>

# Switch window-overflow-size between reasonable and fixed until Reload Config.
toggle-window-overflow-size:
  mod: <NONE>
  key: <NONE>

# set-window-max-count and set-main-pane-count take a number and have no key: run them from the
# command palette or with ametrine://command/set-window-max-count?value=<n>.

# true to show the new window max count (and window-overflow settings) on screen after changing them (default false).
enables-window-count-hud: true

# true to show a short message when a tiled window stays bigger than its tile (an app's minimum size),
# once per window and tile size (default true).
enables-refused-tile-hud: true

# A border around the focused window (default false). Hidden for tiled windows in Fullscreen and in native full screen.
focus-border: true
# glow (soft, like the macOS focus ring), solid or gradient (default glow). cycle-focus-border-style switches live.
focus-border-style: glow
# Points: the ring width for solid and gradient, how far the glow reaches (default 5).
focus-border-width: 5
# accent (the system accent colour), "#RRGGBB" or "#AARRGGBB" (default accent). JankyBorders used "#FF453A".
focus-border-color: accent
# The two gradient colours, top left to bottom right (default purple to gold).
focus-border-gradient: ["#9B5DE5", "#F4B942"]
# Corner radius in points (default 12).
focus-border-radius: 12

# The smallest height that a window can be sized to regardless of its layout frame (in px, default 0).
window-minimum-height: 0

# The smallest width that a window can be sized to regardless of its layout frame (in px, default 0)
window-minimum-width: 0

# List of bundle identifiers for applications to either be automatically floating or automatically tiled based on floating-is-blacklist (default []).
floating: [
  "com.apple.calculator",
  "org.hammerspoon.Hammerspoon",
  "net.duoziwei.KeepTop",
  "com.aone.keka",
  "com.hegenberg.KeyboardCleanTool",
  "com.raycast.macos",
  "com.knollsoft.Hookshot",
  "cc.ffitch.shottr",
  "pro.betterdisplay.BetterDisplay",
  "com.apple.systempreferences",
  "com.apple.finder",
  # md.obsidian title rule replaced by floating-secondary-windows (phase 3):
  # {id: "md.obsidian", window-titles: ["^(Settings|Community plugins|Community themes) - .+ - Obsidian"]},
  {id: "*", window-titles: ["^(Open|Save)$"]}]

# Boolean flag determining behavior of the floating list. true if the applications should be floating and all others tiled. false if the applications should be tiled and all others floating (default true).
floating-is-blacklist: true

# Ametrine: apps whose first window on a space tiles (the "anchor") while
# their other windows (Settings, plugin browsers, Open dialogs…) float.
floating-secondary-windows:
  - md.obsidian

# true to lay windows out over the whole screen, menu bar and Dock area included (default false).
ignore-menu-bar: false

# true if menu bar icon should be hidden, along with the current layout's name next to it (default false).
hide-menu-bar-icon: false

# true if windows smaller than the small-window-size threshold should be floating by default (default true)
# Off here: it was a workaround for secondary windows that Electron and similar apps draw as normal windows,
# which floating-secondary-windows now handles. Still a valid option on its own.
float-small-windows: false

# Pixel threshold for float-small-windows. Windows with both width and height below this value are considered small (in px, default 500).
small-window-size: 500

# true if the mouse should move position to the center of a window when it becomes focused (default false). Note that this is largely incompatible with focus-follows-mouse.
mouse-follows-focus: true

# true if the windows underneath the mouse should become focused as the mouse moves (default false). Note that this is largely incompatible with mouse-follows-focus
focus-follows-mouse: false

# true if dragging and dropping windows on to each other should swap their positions (default false).
mouse-swaps-windows: true

# true if changing the frame of a window with the mouse should update the layout to accommodate the change (default false). Note that not all layouts will be able to respond to the change.
mouse-resizes-windows: true

# true to display the name of the layout when a new layout is selected (default true).
enables-layout-hud: true

# true to display the name of the layout when moving to a new space (default true).
enables-layout-hud-on-space-change: true

# Where a window arriving in the main pane goes (default last).
# first: on top of main (left when main's windows are side by side); with main full, its last window moves out.
# last: at the end; it joins main only while main has room, so main stays as it is.
main-arrival-position: last

# The integer percentage of the screen dimension to increment and decrement main pane ratios by (default 5).
window-resize-step: 5

# Padding to apply between windows and the left edge of the screen (in px, default 0).
screen-padding-left: 0

# Padding to apply between windows and the right edge of the screen (in px, default 0).
screen-padding-right: 0

# Padding to apply between windows and the top edge of the screen (in px, default 0).
screen-padding-top: 0   # padding modes below replace the old 540

# Padding to apply between windows and the bottom edge of the screen (in px, default 0).
screen-padding-bottom: 0

# --- Ametrine: padding modes (virtual monitors on the Ark, anchored to the bottom) ---
# Super+0 cycles full → wide → 27. The selected mode survives restarts;
# padding-mode only applies until a mode has been selected.
mod4:
  - option
  - control
  - shift
  - command
padding-modes:
  - name: full
  - name: wide
    top: 540
  - name: "27"
    left: 640
    right: 640
    top: 720
padding-mode: wide
cycle-padding-mode:
  mod: mod4
  key: "0"

# --- Ametrine: command palette ---
# Super+Y lists every command with its shortcut; type to filter, Enter runs, Esc closes.
show-command-palette:
  mod: mod4
  key: y

# true to maintain layout state across application executions (default true).
restore-layouts-on-launch: true

# true to display some optional debug information in the layout HUD (default false).
debug-layout-info: false
